services:
  db:
    image: postgres:16
    container_name: equiflow_db
    volumes:
      - ./postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: equiflow_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: equiflow_web
    
    command: /app/start.sh
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    environment:
      - PORT=8000
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    container_name: equiflow_worker
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_beat:
    build: .
    container_name: equiflow_beat
    command: celery -A core beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started

  stripe:
    image: stripe/stripe-cli
    command: >
      listen --forward-to web:8000/api/payments/webhook/ 
      --api-key ${STRIPE_SECRET_KEY}
    env_file:
      - .env
    depends_on:
      - web