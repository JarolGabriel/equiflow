services:
  # ===== WEB SERVICE (Django + DRF + Channels) =====
  - type: web
    name: equiflow-web
    env: docker
    plan: free
    region: ohio
    dockerContext: .
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: equiflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: equiflow-redis
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false

  # ===== CELERY WORKER (Background Tasks) =====
  - type: worker
    name: equiflow-worker
    env: docker
    plan: free
    region: ohio
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerCommand: "celery -A core worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: equiflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: equiflow-redis
          property: connectionString
      - key: SECRET_KEY 
        fromService:
          type: web
          name: equiflow-web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY
        sync: false

  # ===== CELERY BEAT (Scheduled Tasks) =====
  - type: worker
    name: equiflow-beat
    env: docker
    plan: free
    region: ohio
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerCommand: "celery -A core beat --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: equiflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: equiflow-redis
          property: connectionString
      - key: SECRET_KEY 
        fromService:
          type: web
          name: equiflow-web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"

  # ===== REDIS (Cache + Celery Broker + Channels) =====
  - type: redis
    name: equiflow-redis
    plan: free
    ipAllowList: [] 

# ===== POSTGRESQL DATABASE =====
databases:
  - name: equiflow-db
    plan: free
    databaseName: equiflow_db